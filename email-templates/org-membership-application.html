<!DOCTYPE html>
<html>
  <head>
    <title>Membership Application</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue",
          sans-serif;
        margin: 0;
        padding: 1em;
        background-color: #f4f4f4;
      }

      p {
        margin-bottom: 1em;
      }

      ol {
        margin-bottom: 1em;
      }

      footer {
        font-size: 0.8em;
        color: #888;
        margin-top: 50px;
        text-align: center;
      }

      strong {
        font-weight: bold;
        color: teal;
      }

      em {
        font-style: italic;
        color: teal;
      }
    </style>
  </head>

  <body>
    <p>Hi @{orgName} admin,</p>
    <p>
      @{applicant} requested to join @{orgName}. Please login to your account to
      approve or reject the request.
    </p>
    <p>Thank you!</p>
    <p>Best regards,</p>
    <p>Team @{appName}</p>

    <footer>Powered by @{appName}</footer>
  </body>
</html>
